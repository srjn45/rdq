name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, autopilot/integration ]

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Spotless (format check)
        run: ./gradlew spotlessCheck
        continue-on-error: true

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest
        continue-on-error: true

      - name: Run tests
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification
        # NOTE: no publish task runs here. Publishing is manual-only via
        # .github/workflows/publish.yml (workflow_dispatch, operator-run).

  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet, build, test all modules
        run: |
          for mod in core storage/postgres server cli sdk-go; do
            echo "--- $mod"
            (cd "$mod" && go vet ./... && go build ./... && go test ./...)
          done

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: go

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build rdq-server image
        run: docker build -t rdq-server:ci .

  cli-release-build:
    name: CLI cross-compile (no publish)
    runs-on: ubuntu-latest
    needs: go

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: latest

      - name: Build CLI snapshot binaries
        # --snapshot: no git tag required; --skip=publish: no upload.
        run: goreleaser build --snapshot --clean --config .goreleaser.yaml
