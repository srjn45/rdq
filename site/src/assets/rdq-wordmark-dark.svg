<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 240" role="img" aria-label="rdq">
  <!-- rdq wordmark (dark backgrounds) — amber retry badge + wordmark.
       Palette: Amber #db6d28  Paper #EEF2F5
       NOTE: "rdq" uses a system font for preview. Convert text to outlines in a
       vector editor before production so the wordmark renders identically everywhere. -->

  <!-- Badge -->
  <rect x="24" y="48" width="144" height="144" rx="34" fill="#db6d28"/>
  <!-- Retry loop inside the badge -->
  <g stroke="#EEF2F5" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 88 A44 44 0 1 1 62 104" />
    <path d="M96 88 l-18 -3 M96 88 l-5 18" />
  </g>

  <!-- "rdq" -->
  <text x="196" y="166" fill="#EEF2F5"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="150" font-weight="700" letter-spacing="-6">rdq</text>
</svg>
